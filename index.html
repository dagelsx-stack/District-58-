<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>District +58 – Control de tienda</title>
<meta name="theme-color" content="#010101">
<meta name="description" content="Inventario, ventas y ganancias de tu tienda.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="District +58">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
<style>
:root{--bg:#E9ECEF;--sur:#F7F8F9;--ink:#101418;--mut:#5B6670;--line:#CDD3D9;--acc:#2447F5;--good:#0E8A4F;--bad:#D6322E;--gold:#FFD23F;color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0F1215;--sur:#171B20;--ink:#EDEFF1;--mut:#8C97A2;--line:#29303A;--acc:#7C93FF;--good:#3DD68C;--bad:#FF6B66;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0F1215;--sur:#171B20;--ink:#EDEFF1;--mut:#8C97A2;--line:#29303A;--acc:#7C93FF;--good:#3DD68C;--bad:#FF6B66;color-scheme:dark}
*{box-sizing:border-box;margin:0}
html{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);scroll-padding-top:env(safe-area-inset-top,0px);background:var(--bg)}
body{font:15px/1.45 'Archivo',system-ui,-apple-system,Segoe UI,sans-serif;background:var(--bg);color:var(--ink);padding-bottom:84px}
.wrap{max-width:560px;margin:0 auto;padding:16px}
.top,.top2{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.brand{font-weight:900;font-stretch:125%;font-size:22px;letter-spacing:-.02em}
.brand.big{font-size:34px;margin:12vh 0 8px}
h2{font-weight:800;font-stretch:112%;font-size:20px}
.mut{color:var(--mut)}.sm{font-size:13px}
.hero{padding:22px 0 10px}
.hero .big{font-weight:800;font-stretch:115%;font-size:54px;line-height:1.05;letter-spacing:-.03em;font-variant-numeric:tabular-nums;margin:4px 0}
.pos{color:var(--good)}.neg{color:var(--bad)}
section{margin-top:14px}
svg{width:100%;height:auto;display:block}
svg text{font-size:9px;fill:var(--mut)}
.leg{display:flex;gap:14px;font-size:13px;color:var(--mut);margin-top:6px;flex-wrap:wrap}
.leg i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:5px}
.cap{font-size:12px;color:var(--mut);margin-top:4px}
.empty{padding:34px 8px;text-align:center;color:var(--mut);border:1px dashed var(--line);border-radius:10px}
.row{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--line)}
.row b{font-variant-numeric:tabular-nums}
.mini{width:110px;text-align:right;font-weight:700}
.rks{display:flex;gap:18px}
.rk{display:inline-grid;place-items:center;width:26px;height:26px;border-radius:6px;font-weight:900;font-size:13px}
.rS{background:var(--gold);color:#111}.rA{background:var(--acc);color:#fff}.rB{background:var(--good);color:#fff}.rC{background:var(--line);color:var(--mut)}
:root[data-theme="dark"] .rA,:root[data-theme="dark"] .rB{color:#0F1215}
.ph{width:56px;height:56px;border-radius:8px;object-fit:cover;background:var(--line);display:grid;place-items:center;font-weight:800;font-size:20px;color:var(--mut)}
.nm{display:flex;justify-content:space-between;align-items:center;gap:8px}
.bar{height:4px;background:var(--line);border-radius:2px;overflow:hidden;margin:8px 0}
.bar i{display:block;height:100%;background:var(--acc)}
.acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px;justify-content:flex-end}
.btn{font:inherit;font-weight:700;border:1px solid var(--ink);border-radius:8px;padding:10px 16px;background:var(--ink);color:var(--bg);cursor:pointer}
.btn.g{background:transparent;color:var(--ink);border-color:var(--line)}
.btn.sm{padding:6px 11px;font-size:13px}
.btn:focus-visible,input:focus-visible,select:focus-visible,.nav button:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
dialog{width:min(92vw,440px);margin:auto;border:0;border-radius:14px;background:var(--sur);color:var(--ink);padding:18px;max-height:90vh;overflow:auto}
dialog::backdrop{background:rgba(0,0,0,.5)}
.f{display:block;margin:10px 0 4px;color:var(--mut);font-size:13px}
input,select{width:100%;font:inherit;padding:10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pick{display:flex;gap:10px;align-items:center}.pick .ph{flex:none}
.sum{margin-top:12px;padding:10px;border-radius:8px;background:var(--bg);font-size:14px}
#toast{position:fixed;left:50%;bottom:92px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:8px;font-weight:600;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s;max-width:90vw;text-align:center}
#toast.show{opacity:1}
@media (prefers-reduced-motion:reduce){#toast{transition:none}}
[hidden]{display:none!important}
.top .brand{display:flex;align-items:center;gap:10px}
.logo{width:34px;height:34px;border-radius:9px;display:block}
.lg{width:132px;height:132px;border-radius:30px;display:block;margin:9vh auto 0;box-shadow:0 14px 40px rgba(0,0,0,.4)}
.brand.big{text-align:center;margin:16px 0 8px}
.ph svg{width:28px;height:28px}
.isl{position:fixed;left:50%;bottom:calc(14px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);display:flex;padding:6px;border-radius:999px;background:color-mix(in srgb,var(--sur) 82%,transparent);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border:1px solid var(--line);box-shadow:0 10px 30px rgba(0,0,0,.35);z-index:5;--i:0}
.isl button{position:relative;z-index:1;width:104px;font:inherit;font-weight:700;font-size:14px;background:none;border:0;color:var(--mut);padding:11px 0;border-radius:999px;cursor:pointer;transition:color .25s,transform .2s}
.isl button.on{color:var(--bg);animation:pop .45s}
.isl button:hover{transform:translateY(-2px)}
.isl button:active{transform:scale(.92)}
.isl button:focus-visible{outline:2px solid var(--acc);outline-offset:-3px}
.isl .ind{position:absolute;top:6px;bottom:6px;left:6px;width:104px;border-radius:999px;background:var(--ink);transform:translateX(calc(var(--i)*104px));transition:transform .5s cubic-bezier(.34,1.5,.5,1)}
@keyframes pop{40%{transform:scale(1.12)}}
.cd{display:grid;grid-template-columns:56px 1fr;gap:12px;padding:14px;margin-top:10px;background:var(--sur);border:1px solid var(--line);border-radius:16px;cursor:pointer;transition:transform .2s,border-color .2s,box-shadow .2s}
.cd:active{transform:scale(.985)}
.cd.on{border-color:var(--acc);box-shadow:0 0 0 1px var(--acc)}
.cd .acts{justify-content:flex-start;margin-top:8px}
.bar i{transition:width .8s cubic-bezier(.2,.8,.2,1)}
.bar i.c1{background:var(--good)}
.cmp{margin-top:12px;padding:14px;border-radius:16px;background:var(--sur);border:1px solid var(--line)}
.cmph{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:6px}
.tag{display:inline-flex;gap:8px;align-items:center;padding:4px 6px 4px 12px;border-radius:999px;font-weight:700;font-size:13px}
.tag.c0{box-shadow:inset 0 0 0 1.5px var(--acc)}.tag.c1{box-shadow:inset 0 0 0 1.5px var(--good)}
.mrow{margin-top:10px}.mb{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center}.mb .bar{margin:5px 0}
.chip{display:inline-block;font-weight:800;font-size:14px;padding:3px 10px;border-radius:999px;opacity:0;transform:translateY(6px);transition:opacity .3s,transform .3s}
.chip.show{opacity:1;transform:none}.chip.up{background:var(--good);color:var(--bg)}.chip.dn{background:var(--bad);color:var(--bg)}
@media (prefers-reduced-motion:reduce){.isl .ind,.bar i,.isl button,.chip{transition:none;animation:none}}
.wrap{position:relative;z-index:1}
#toast{z-index:9}
:root[data-theme="led"]{--bg:#000;--sur:#07080C;--ink:#fff;--mut:#9AA3B2;--line:#1B2030;--acc:#00E5FF;--good:#39FF88;--bad:#FF3B5C;--gold:#FFE600;color-scheme:dark}
:root[data-theme="led"] .rA,:root[data-theme="led"] .rB,:root[data-theme="led"] .isl button.on{color:#000}
:root[data-theme="led"] .isl .ind{background:var(--acc);box-shadow:0 0 18px var(--acc)}
:root[data-theme="led"] .top3 .big,:root[data-theme="led"] .brand{text-shadow:0 0 14px currentColor}
:root[data-theme="led"] polyline[stroke*="good"]{filter:drop-shadow(0 0 5px var(--good))}
:root[data-theme="led"] polyline[stroke*="acc"]{filter:drop-shadow(0 0 5px var(--acc))}
:root[data-theme="led"] .flow i{opacity:.5}
.flow{position:fixed;inset:0;overflow:hidden;pointer-events:none;z-index:0}
.flow i{position:absolute;width:60vmax;height:60vmax;border-radius:50%;filter:blur(80px);opacity:.26;animation:fl 28s ease-in-out infinite alternate}
.flow .b1{background:var(--acc);left:-20vmax;top:-18vmax}
.flow .b2{background:var(--good);right:-25vmax;top:30vh;animation-duration:36s;animation-delay:-8s;opacity:.16}
.flow .b3{background:var(--gold);left:5vmax;bottom:-30vmax;animation-duration:44s;animation-delay:-16s;opacity:.1}
@keyframes fl{to{transform:translate(12vmax,8vmax) scale(1.18) rotate(30deg)}}
.dam{--dm:url("data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' width='120' height='120'><g fill='none' stroke='black' stroke-width='1.6'><path d='M60 14C70 30 80 38 80 54C80 66 72 74 60 84C48 74 40 66 40 54C40 38 50 30 60 14Z'/><path d='M60 34C64 42 68 46 68 54C68 60 64 64 60 68C56 64 52 60 52 54C52 46 56 42 60 34Z'/><path d='M60 84C48 88 36 96 34 110M60 84C72 88 84 96 86 110M40 54C28 50 18 56 16 66M80 54C92 50 102 56 104 66'/><circle cx='0' cy='0' r='5'/><circle cx='120' cy='0' r='5'/><circle cx='0' cy='120' r='5'/><circle cx='120' cy='120' r='5'/></g></svg>");position:absolute;inset:0;background:var(--ink);opacity:.055;-webkit-mask-image:var(--dm);mask-image:var(--dm);-webkit-mask-size:120px;mask-size:120px;filter:blur(.7px);animation:dr 70s linear infinite}
@keyframes dr{to{-webkit-mask-position:240px 120px;mask-position:240px 120px}}
.nobg .flow{display:none}
.card,.cd,.cmp,.isls>div{background:color-mix(in srgb,var(--sur) 78%,transparent);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
.card{border:1px solid var(--line);border-radius:20px;padding:14px;margin-top:12px}
.isls{display:grid;grid-template-columns:1fr 1fr;gap:2px;margin-top:12px;border-radius:20px;overflow:hidden;background:var(--line);border:1px solid var(--line)}
.isls>div{padding:13px 16px;min-width:0}
.isls .w{grid-column:span 2}
.isls.r3{grid-template-columns:repeat(3,1fr)}.isls.r3>div{padding:12px}
.isls .cn{display:block;font-size:20px;font-weight:800;font-variant-numeric:tabular-nums}
.isls small{display:block;color:var(--mut);font-size:12px;margin-top:2px}
.top3 .big{font-weight:800;font-stretch:112%;font-size:34px;line-height:1.1;letter-spacing:-.02em;font-variant-numeric:tabular-nums;margin:2px 0}
.top3 .chip{margin-top:4px}
.capin{font-size:34px;font-weight:800;font-stretch:112%;border:0;background:none;padding:0;width:100%;color:var(--ink);line-height:1.1}
.segs{display:flex;gap:6px;flex-wrap:wrap}
.seg{font:inherit;font-weight:700;font-size:13px;padding:8px 14px;border-radius:999px;border:1px solid var(--line);background:none;color:var(--ink);cursor:pointer;transition:background .2s,color .2s}
.seg.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
dialog h3{font-size:15px;font-weight:800;margin-top:20px}
.two3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
textarea{width:100%;font:inherit;padding:10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);margin:6px 0}
dialog input[type=file]{padding:8px}

:root{--be:#C77700}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--be:#FFD23F}:root:not([data-theme="light"]) .dmk{opacity:.6;filter:grayscale(1) brightness(.72) contrast(1.15)}}
:root[data-theme="dark"]{--be:#FFD23F}:root[data-theme="dark"] .dmk{opacity:.6;filter:grayscale(1) brightness(.72) contrast(1.15)}
:root[data-theme="led"]{--be:#FFE600}:root[data-theme="led"] .dmk{opacity:.3;filter:grayscale(1) brightness(.45) contrast(1.3)}

.cd{background-image:linear-gradient(105deg,rgba(255,255,255,.08),transparent 70%)}
.cd .bar i{background:var(--ink)}.cd .ph{box-shadow:0 0 0 1px var(--line)}
.cd.on{border-color:var(--ink);box-shadow:0 0 0 1px var(--ink),0 12px 26px var(--sh)}
.lw{font-size:12px;font-weight:800;padding:2px 8px;border-radius:999px;background:var(--bad);color:#fff;white-space:nowrap}
.lowc{border-color:var(--bad)}
.isl button[data-n]:not([data-n=""])::after{content:attr(data-n);position:absolute;top:2px;right:10px;min-width:18px;height:18px;border-radius:9px;background:var(--ink);color:var(--bg);font-size:11px;line-height:18px}

@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--sh:rgba(0,0,0,.55)}}
:root[data-theme="dark"],:root[data-theme="led"]{--sh:rgba(0,0,0,.55)}

const uc=x=>x.c+(x.f||0);

function buildP(){
 const ev=[...db.buys.map(x=>[x.d,x.q*uc(x),0]),...db.exps.map(x=>[x.d,x.a,0]),...db.sales.map(x=>[x.d,0,x.q*x.p])].sort((a,b)=>a[0]<b[0]?-1:a[0]>b[0]?1:0);
 if(!ev.length)return null;
 const ds=[...new Set(ev.map(e=>e[0]))],t0=Date.parse(ds[0]);let ci=0,cs=0;const P=[{x:0,i:0,s:0,b:0}];
